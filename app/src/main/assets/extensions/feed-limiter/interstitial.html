<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed Limiter</title>
<link rel="stylesheet" href="interstitial.css">
</head>
<body>
  <!--
    Passive, non-interactive full-screen interstitial. No buttons, links,
    or gesture targets anywhere on this page - it only clears via the
    daily local-midnight reset or a friction-gated settings change
    elsewhere in the app. See interstitial.js for the random activity
    selection (unchanged) and the display-label/image lookup used to
    populate the three bands below.
  -->
  <div id="bands">
    <section class="band" id="band-0">
      <div class="band-scrim"></div>
      <p class="band-label"></p>
    </section>
    <section class="band" id="band-1">
      <div class="band-scrim"></div>
      <p class="band-label"></p>
    </section>
    <section class="band" id="band-2">
      <div class="band-scrim"></div>
      <p class="band-label"></p>
    </section>
  </div>
  <script src="config.js"></script>
  <script src="interstitial.js"></script>
</body>
</html>
